<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("sot-theme");
          var supportDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (mode === "dark" || ((!mode || mode === "system") && supportDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0d14" />
    <meta
      name="description"
      content="Verify factual claims against live web evidence and semantic vector intelligence in seconds."
    />
    <meta property="og:title" content="Sentinels of Truth — AI Fact Verification Engine" />

      content="Verify factual claims against live web evidence and semantic vector intelligence in seconds."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />
    <title>Sentinels of Truth — AI Fact Verification Engine</title>
  </head>

</html>
