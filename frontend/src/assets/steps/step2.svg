<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tile2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#14264e" />
      <stop offset="100%" stop-color="#1e3a78" />
    </linearGradient>
    <linearGradient id="cyanGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="480" height="480" rx="48" fill="url(#tile2)" />
  <rect width="476" height="476" x="2" y="2" rx="46" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />

  <!-- Subtle glow -->
  <circle cx="230" cy="230" r="130" fill="#38bdf8" opacity="0.08" />

  <!-- Globe & Magnifying Glass -->
  <g transform="translate(100, 100)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Globe behind -->
    <circle cx="120" cy="140" r="70" fill="none" stroke="#64748b" stroke-width="8" stroke-dasharray="6 6" />
    <ellipse cx="120" cy="140" rx="35" ry="70" fill="none" stroke="#64748b" stroke-width="6" stroke-dasharray="6 6" />
    <line x1="50" y1="140" x2="190" y2="140" stroke="#64748b" stroke-width="6" stroke-dasharray="6 6" />

    <!-- Magnifying Glass Lens -->
    <circle cx="160" cy="110" r="65" fill="#0f172a" fill-opacity="0.7" stroke="url(#cyanGlow2)" stroke-width="14" />

    <!-- Lat/Long lines inside magnifying glass -->
    <ellipse cx="160" cy="110" rx="30" ry="60" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.9" />
    <line x1="100" y1="110" x2="220" y2="110" stroke="#ffffff" stroke-width="8" stroke-opacity="0.9" />

    <!-- Magnifying Glass Handle -->
    <line x1="206" y1="156" x2="255" y2="205" stroke="#ffffff" stroke-width="18" />
    <line x1="206" y1="156" x2="255" y2="205" stroke="url(#cyanGlow2)" stroke-width="12" />
  </g>
</svg>
