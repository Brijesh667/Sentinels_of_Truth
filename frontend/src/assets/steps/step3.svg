<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tile3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#14264e" />
      <stop offset="100%" stop-color="#1e3a78" />
    </linearGradient>
    <linearGradient id="cyanGlow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="480" height="480" rx="48" fill="url(#tile3)" />
  <rect width="476" height="476" x="2" y="2" rx="46" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />

  <!-- Subtle glow -->
  <circle cx="240" cy="230" r="130" fill="#38bdf8" opacity="0.08" />

  <!-- Balance Scale with Checkmark -->
  <g transform="translate(100, 100)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base & Pillar -->
    <path d="M100 230 L180 230" stroke="#ffffff" stroke-width="12" />
    <path d="M140 230 L140 70" stroke="#ffffff" stroke-width="12" />
    <circle cx="140" cy="65" r="12" fill="url(#cyanGlow3)" />

    <!-- Crossbeam (slight tilt) -->
    <path d="M40 85 L240 75" stroke="url(#cyanGlow3)" stroke-width="12" />

    <!-- Left Pan -->
    <path d="M40 85 L20 150 M40 85 L60 150" stroke="#94a3b8" stroke-width="6" />
    <path d="M10 150 Q40 180 70 150 Z" fill="#1e293b" stroke="url(#cyanGlow3)" stroke-width="8" />

    <!-- Right Pan with Checkmark -->
    <path d="M240 75 L220 140 M240 75 L260 140" stroke="#94a3b8" stroke-width="6" />
    <path d="M210 140 Q240 170 270 140 Z" fill="#1e293b" stroke="url(#cyanGlow3)" stroke-width="8" />

    <!-- Checkmark above right pan -->
    <path d="M225 110 L237 122 L258 98" stroke="#34d399" stroke-width="10" />
  </g>
</svg>
