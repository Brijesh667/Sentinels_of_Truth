<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tile4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#14264e" />
      <stop offset="100%" stop-color="#1e3a78" />
    </linearGradient>
    <linearGradient id="cyanGlow4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="480" height="480" rx="48" fill="url(#tile4)" />
  <rect width="476" height="476" x="2" y="2" rx="46" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />

  <!-- Subtle glow -->
  <circle cx="240" cy="230" r="130" fill="#38bdf8" opacity="0.08" />

  <!-- Database Cylinder with Shield -->
  <g transform="translate(110, 100)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top ellipse -->
    <ellipse cx="130" cy="50" rx="80" ry="24" fill="#0f172a" stroke="url(#cyanGlow4)" stroke-width="12" />

    <!-- Middle tier -->
    <path d="M50 50 V110 C50 124, 85 134, 130 134 C175 134, 210 124, 210 110 V50" fill="none" stroke="#ffffff" stroke-width="10" />

    <!-- Bottom tier -->
    <path d="M50 110 V170 C50 184, 85 194, 130 194 C175 194, 210 184, 210 170 V110" fill="none" stroke="url(#cyanGlow4)" stroke-width="10" />

    <!-- Shield in front right -->
    <g transform="translate(130, 90)">
      <path
        d="M0 10 C35 10, 45 0, 45 0 C45 0, 55 10, 90 10 C90 65, 55 95, 45 105 C35 95, 0 65, 0 10 Z"
        fill="#0b1329"
        stroke="#ffffff"
        stroke-width="10"
      />
      <!-- Shield checkmark -->
      <path d="M28 50 L40 62 L64 36" stroke="#38bdf8" stroke-width="9" />
    </g>
  </g>
</svg>
