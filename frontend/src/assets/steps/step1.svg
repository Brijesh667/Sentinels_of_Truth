<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tile1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#14264e" />
      <stop offset="100%" stop-color="#1e3a78" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="480" height="480" rx="48" fill="url(#tile1)" />
  <rect width="476" height="476" x="2" y="2" rx="46" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />

  <!-- Background subtle glow circle -->
  <circle cx="240" cy="230" r="130" fill="#38bdf8" opacity="0.08" />

  <!-- Chat bubble icon -->
  <g transform="translate(100, 100)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bubble outline -->
    <path
      d="M40 70 C40 38, 68 18, 140 18 C212 18, 240 38, 240 70 C240 102, 212 122, 140 122 C115 122, 95 128, 65 146 C72 130, 70 122, 58 116 C46 104, 40 88, 40 70 Z"
      fill="none"
