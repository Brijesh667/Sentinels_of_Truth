    />
    <!-- Question mark inside -->
    <path
      d="M125 58 C125 45, 134 38, 142 38 C152 38, 160 45, 160 55 C160 70, 140 74, 140 90"
      fill="none"
      stroke="#ffffff"
      stroke-width="14"
