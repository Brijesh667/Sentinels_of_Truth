<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)" />

  <g filter="url(#blur)">
    <!-- Vibrant blue / cyan / indigo mesh blobs matching logo colors -->
    <circle cx="250" cy="220" r="260" fill="#1d65f6" opacity="0.85" />
    <circle cx="650" cy="180" r="280" fill="#38bdf8" opacity="0.9" />
    <circle cx="980" cy="300" r="250" fill="#67e8f9" opacity="0.85" />
    <circle cx="450" cy="420" r="240" fill="#4f46e5" opacity="0.8" />
    <circle cx="820" cy="460" r="220" fill="#2563eb" opacity="0.85" />
    <circle cx="150" cy="480" r="200" fill="#0284c7" opacity="0.75" />
  </g>
</svg>
